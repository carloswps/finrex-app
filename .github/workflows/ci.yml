name: .NET Core CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main


jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore Finrex-App.sln
      - name: Build
        run: dotnet build Finrex-App.sln --no-restore
      - name: Test
        run: dotnet test Finrex-App.sln --no-build --verbosity normal 